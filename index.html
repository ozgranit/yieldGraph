<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Market Investment Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .input-container {
            margin-bottom: 20px;
        }
        label {
            display: inline-block;
            width: 200px;
            font-weight: bold;
        }
        input {
            padding: 5px;
            width: 150px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        #chartContainer {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>Stock Market Investment Calculator</h1>

    <div class="input-container">
        <label for="stockInvestment">Stock Market Investment:</label>
        <input type="number" id="stockInvestment" placeholder="Enter amount" step="0.01">
    </div>

    <button onclick="plotGraph()">Calculate & Plot</button>

    <div id="chartContainer">
        <canvas id="investmentChart"></canvas>
    </div>

    <script>
        let myChart = null;

        function plotGraph() {
            const investment = parseFloat(document.getElementById('stockInvestment').value);

            if (isNaN(investment) || investment <= 0) {
                alert('Please enter a valid investment amount');
                return;
            }

            // Calculate investment values for 30 years with 7% annual growth
            const years = [];
            const values = [];

            for (let year = 0; year <= 30; year++) {
                years.push(year);
                values.push(investment * Math.pow(1.07, year));
            }

            // Destroy existing chart if it exists
            if (myChart) {
                myChart.destroy();
            }

            // Create new chart
            const ctx = document.getElementById('investmentChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: years,
                    datasets: [{
                        label: 'Investment Value ($)',
                        data: values,
                        borderColor: 'rgb(75, 192, 192)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        tension: 0.1,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: '30-Year Investment Growth at 7% Annual Return'
                        },
                        legend: {
                            display: true
                        }
                    },
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Years'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Value ($)'
                            },
                            ticks: {
                                callback: function(value) {
                                    return '$' + value.toFixed(2);
                                }
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
