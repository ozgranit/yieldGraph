<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Market Investment Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .input-container {
            margin-bottom: 20px;
        }
        label {
            display: inline-block;
            width: 200px;
            font-weight: bold;
        }
        input {
            padding: 5px;
            width: 150px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        #chartContainer {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>Stock Market Investment Calculator</h1>

    <div class="input-container">
        <p style="background-color: #f0f0f0; padding: 15px; border-radius: 5px; font-size: 14px;">
            <strong>Historical 30 year Growth rates:</strong> SPY 8.2%, Housing 5.4%, Rent 2.0%
        </p>
    </div>

    <div class="input-container">
        <label for="stockInvestment">Investment:</label>
        <input type="number" id="stockInvestment" placeholder="Enter amount" step="0.01">
    </div>

    <div class="input-container">
        <label for="mortgageValue">Mortgage Value:</label>
        <input type="number" id="mortgageValue" placeholder="Enter amount" step="0.01" value="0">
    </div>

    <div class="input-container">
        <label for="mortgageRate">Mortgage Interest Rate (%):</label>
        <input type="number" id="mortgageRate" placeholder="e.g., 4" step="0.01" value="4">
    </div>

    <div class="input-container">
        <label for="monthlyRent">Monthly Rent:</label>
        <input type="number" id="monthlyRent" placeholder="Enter amount" step="0.01" value="0">
    </div>

    <div class="input-container">
        <label for="expectedYield">Expected S&P Yield (%):</label>
        <input type="number" id="expectedYield" placeholder="e.g., 7" step="0.01" value="7">
    </div>

    <div class="input-container">
        <label for="housingYield">Expected Housing Yield (%):</label>
        <input type="number" id="housingYield" placeholder="e.g., 5.4" step="0.01" value="5.4">
    </div>

    <button onclick="plotGraph()">Calculate & Plot</button>

    <div id="calculationSummary" style="display: none; background-color: #e8f4f8; padding: 15px; border-radius: 5px; margin-top: 20px; font-size: 14px;">
        <h3 style="margin-top: 0;">Calculation Summary:</h3>
        <p id="mortgagePaymentInfo"></p>
        <p id="differenceInfo"></p>
        <p id="strategyInfo"></p>
    </div>

    <div id="chartContainer">
        <canvas id="investmentChart"></canvas>
    </div>

    <script>
        let myChart = null;

        function plotGraph() {
            const investment = parseFloat(document.getElementById('stockInvestment').value);
            const mortgage = parseFloat(document.getElementById('mortgageValue').value);
            const mortgageRate = parseFloat(document.getElementById('mortgageRate').value);
            const monthlyRent = parseFloat(document.getElementById('monthlyRent').value);
            const yieldRate = parseFloat(document.getElementById('expectedYield').value);
            const housingYield = parseFloat(document.getElementById('housingYield').value);

            if (isNaN(investment) || investment <= 0) {
                alert('Please enter a valid investment amount');
                return;
            }

            if (isNaN(mortgage) || mortgage < 0) {
                alert('Please enter a valid mortgage value');
                return;
            }

            if (isNaN(mortgageRate) || mortgageRate < 0) {
                alert('Please enter a valid mortgage interest rate');
                return;
            }

            if (isNaN(monthlyRent) || monthlyRent < 0) {
                alert('Please enter a valid monthly rent amount');
                return;
            }

            if (isNaN(yieldRate) || yieldRate <= 0) {
                alert('Please enter a valid S&P yield percentage');
                return;
            }

            if (isNaN(housingYield) || housingYield <= 0) {
                alert('Please enter a valid housing yield percentage');
                return;
            }

            // Calculate monthly mortgage payment using amortization formula
            const monthlyMortgageRate = mortgageRate / 100 / 12;
            const numPayments = 30 * 12; // 30 years
            let monthlyMortgagePayment = 0;

            if (mortgage > 0 && mortgageRate > 0) {
                monthlyMortgagePayment = mortgage * (monthlyMortgageRate * Math.pow(1 + monthlyMortgageRate, numPayments)) /
                                        (Math.pow(1 + monthlyMortgageRate, numPayments) - 1);
            }

            // Calculate the difference between rent and mortgage
            const monthlyDifference = monthlyRent - monthlyMortgagePayment;

            // Calculate investment values for 30 years
            const years = [];
            const housingValues = [];
            const rentAndInvestValues = [];
            const monthlyGrowthMultiplier = Math.pow(1 + (yieldRate / 100), 1/12);
            const housingGrowthMultiplier = 1 + (housingYield / 100);

            // Initial values
            // Renter: starts with initial investment in S&P
            let rentInvestBalance = investment;
            // Homeowner: starts with $0 in S&P (all goes to down payment)
            let housingInvestBalance = 0;
            let remainingMortgage = mortgage;

            for (let year = 0; year <= 30; year++) {
                years.push(year);

                // Scenario 1: Buy house with mortgage
                const houseValue = (investment + mortgage) * Math.pow(housingGrowthMultiplier, year);
                const mortgageRemaining = year < 30 ? remainingMortgage : 0;
                // Net worth = house equity + S&P balance (from investing difference if rent > mortgage)
                housingValues.push(houseValue - mortgageRemaining + housingInvestBalance);

                // Scenario 2: Rent and invest
                rentAndInvestValues.push(rentInvestBalance);

                // Calculate monthly changes for next year
                if (year < 30) {
                    for (let month = 0; month < 12; month++) {
                        // Pay down mortgage principal
                        if (mortgage > 0) {
                            const interestPayment = remainingMortgage * monthlyMortgageRate;
                            const principalPayment = monthlyMortgagePayment - interestPayment;
                            remainingMortgage -= principalPayment;
                        }

                        // Whoever pays less invests the difference
                        if (monthlyDifference > 0) {
                            // Rent is higher than mortgage: homeowner invests the difference
                            housingInvestBalance = (housingInvestBalance + monthlyDifference) * monthlyGrowthMultiplier;
                            // Renter just grows existing balance (rent is already their cost)
                            rentInvestBalance = rentInvestBalance * monthlyGrowthMultiplier;
                        } else {
                            // Mortgage is higher than rent: renter invests the difference
                            rentInvestBalance = (rentInvestBalance - monthlyDifference) * monthlyGrowthMultiplier;
                            // Homeowner just grows existing balance (mortgage is already their cost)
                            housingInvestBalance = housingInvestBalance * monthlyGrowthMultiplier;
                        }
                    }
                }
            }

            // Destroy existing chart if it exists
            if (myChart) {
                myChart.destroy();
            }

            // Create new chart
            const ctx = document.getElementById('investmentChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: years,
                    datasets: [{
                        label: 'Buy House (Net Equity)',
                        data: housingValues,
                        borderColor: 'rgb(255, 99, 132)',
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        tension: 0.1,
                        fill: false
                    },
                    {
                        label: 'Rent + Invest in S&P',
                        data: rentAndInvestValues,
                        borderColor: 'rgb(153, 102, 255)',
                        backgroundColor: 'rgba(153, 102, 255, 0.2)',
                        tension: 0.1,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: `30-Year Comparison: Buy House vs Rent + Invest`
                        },
                        legend: {
                            display: true
                        }
                    },
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Years'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Net Worth ($)'
                            },
                            ticks: {
                                callback: function(value) {
                                    return '$' + Math.round(value).toLocaleString();
                                }
                            }
                        }
                    }
                }
            });

            // Update calculation summary
            const summaryDiv = document.getElementById('calculationSummary');
            const mortgageInfo = document.getElementById('mortgagePaymentInfo');
            const differenceInfo = document.getElementById('differenceInfo');
            const strategyInfo = document.getElementById('strategyInfo');

            if (mortgage > 0) {
                mortgageInfo.innerHTML = `<strong>Monthly Mortgage Payment:</strong> $${Math.round(monthlyMortgagePayment).toLocaleString()}`;
            } else {
                mortgageInfo.innerHTML = `<strong>Monthly Mortgage Payment:</strong> $0 (no mortgage)`;
            }

            if (monthlyDifference > 0) {
                differenceInfo.innerHTML = `<strong>Monthly Difference:</strong> Rent is $${Math.round(Math.abs(monthlyDifference)).toLocaleString()} higher than mortgage`;
                strategyInfo.innerHTML = `<strong>Who Invests the Difference:</strong> Homeowner invests $${Math.round(Math.abs(monthlyDifference)).toLocaleString()}/month in S&P 500`;
            } else if (monthlyDifference < 0) {
                differenceInfo.innerHTML = `<strong>Monthly Difference:</strong> Mortgage is $${Math.round(Math.abs(monthlyDifference)).toLocaleString()} higher than rent`;
                strategyInfo.innerHTML = `<strong>Who Invests the Difference:</strong> Renter invests $${Math.round(Math.abs(monthlyDifference)).toLocaleString()}/month in S&P 500`;
            } else {
                differenceInfo.innerHTML = `<strong>Monthly Difference:</strong> Rent and mortgage are equal`;
                strategyInfo.innerHTML = `<strong>Who Invests the Difference:</strong> No additional monthly investment`;
            }

            summaryDiv.style.display = 'block';
        }
    </script>
</body>
</html>
